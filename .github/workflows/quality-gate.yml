name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret and history scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks itself, pinned and checksum-verified. The previous gitleaks action scanned only the first 30 commits of a
      # pull request (one page of the commits API); this scans every commit of the pull request or push.
      - name: Install gitleaks 8.24.3 (pinned, checksum-verified)
        run: |
          set -euo pipefail
          f=gitleaks_8.24.3_linux_x64.tar.gz
          curl -sSfL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/$f"
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
      - name: Scan every commit of the pull request or push
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) range="$PR_BASE..$PR_HEAD" ;;
            push)
              if [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then range="$PUSH_AFTER"; else range="$PUSH_BEFORE..$PUSH_AFTER"; fi ;;
            *) range="HEAD" ;;
          esac
          echo "event=$EVENT range=$range commits=$(git rev-list --count --no-merges "$range")"
          # .gitleaksignore (exact fingerprints only) is read from the repository root.
          "$RUNNER_TEMP/gitleaks" detect --source . --redact --no-banner --exit-code=1 --log-opts="--no-merges $range"

  application:
    name: Unit, dependency and build checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.33.0
          run_install: false
      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run web unit tests
        run: pnpm test:web
      - name: Test fail-closed release readiness gate
        run: pnpm test:release-gate
      - name: Audit production dependencies
        run: pnpm audit --prod
      - name: Prepare ephemeral build-only configuration
        shell: bash
        run: |
          node -e "const fs=require('node:fs'),c=require('node:crypto'); fs.appendFileSync(process.env.GITHUB_ENV,'PAYLOAD_SECRET='+c.randomBytes(48).toString('hex')+'\n')"
          echo 'OTONOM_CMS_DATABASE_URL=postgresql://ci@127.0.0.1:5432/ci' >> "$GITHUB_ENV"
          echo 'OTONOM_DOMAIN_DATABASE_URL=postgresql://ci@127.0.0.1:5432/ci' >> "$GITHUB_ENV"
      - name: Verify production build
        run: pnpm build
